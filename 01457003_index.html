<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <title>UX-design for online retailer</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="./picture/icon.jfif">
</head>

<body>
    <header>
        <img src="./picture/header_pic.webp" alt="pic">
        <h2>遙控車零售商</h2>
    </header>
    <nav>
        <button id="normal_car_btn">普通遙控車</button>
        <button id="sports_car_btn">跑車遙控車</button>
        <button id="airplain_btn">遙控飛機</button>
        <button id="drone_btn">無人機</button>
    </nav>
    <main>
        <div id="default_page" class="page">
            <button id="enter_shopping_page_btn">進入採購</button>
        </div>
        <div id="shopping_page" class="page">
            <div id="normal_car_groop" class="items_page">
                <div class="single_item">
                    <img src="./picture/AE86.png" alt="pic">
                    <div class="single_item_detail">
                        <p>AE86  $2100</p>
                        <div>
                            <button id="item1_minus">-</button>
                            <p id="item1_select_num">0</p>
                            <button id="item1_add">+</button>
                        </div>
                        <button id="item1_buy">加入購物車</button>
                        <p id="item1_stock">庫存:10</p>
                    </div>
                </div>
            </div>
            <div id="sports_car_groop" class="items_page"></div>
            <div id="airplain_groop" class="items_page"></div>
            <div id="drone_groop" class="items_page"></div>
        </div>
        <div id="user_cart_items_page" class="page"></div>
        <div id="checkout_page" class="page"></div>
    </main>
    <div id="view_cart_items">
        <button id="cart_items_btn">
            <span id="total_price_state">查看清單</span>
            <img src="./picture/shopping_car.png">
            <span id="total_price">$0</span>
        </button>
    </div>
    <script src="functional.js"></script>
    <script src="interactive.js"></script>
</body>
</html>
