<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <title>UX-design for online retailer</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="./picture/icon.jfif">
</head>

<body>
    <header>
        <img src="./picture/header_pic.webp" alt="pic">
        <h2>遙控車零售商</h2>
    </header>
    <nav>
        <button id="normal_car_btn">普通遙控車</button>
        <button id="sports_car_btn">跑車遙控車</button>
        <button id="airplain_btn">遙控飛機</button>
        <button id="drone_btn">無人機</button>
    </nav>
    <main>
        <div id="default_page" class="page">
            <button id="enter_shopping_page_btn">進入採購</button>
        </div>
        <div id="shopping_page" class="page">
            <div id="normal_car_groop" class="items_page">
                <div class="single_item">
                    <img src="./picture/AE86.png" alt="pic">
                    <div class="single_item_detail">
                        <p>AE86  $2100</p>
                        <div>
                            <button id="item1_minus">-</button>
                            <p id="item1_select_num">0</p>
                            <button id="item1_add">+</button>
                        </div>
                        <button id="item1_buy">加入購物車</button>
                        <p id="item1_stock">庫存:10</p>
                    </div>
                </div>
                <div class="single_item">
                    <img src="./picture/遙控越野車.png" alt="pic">
                    <div class="single_item_detail">
                        <p>遙控越野車  $1800</p>
                        <div>
                            <button id="item2_minus">-</button>
                            <p id="item2_select_num">0</p>
                            <button id="item2_add">+</button>
                        </div>
                        <button id="item2_buy">加入購物車</button>
                        <p id="item2_stock">庫存:10</p>
                    </div>
                </div>
                <div class="single_item">
                    <img src="./picture/四驅遙控車.png" alt="pic">
                    <div class="single_item_detail">
                        <p>四驅遙控車  $2400</p>
                        <div>
                            <button id="item3_minus">-</button>
                            <p id="item3_select_num">0</p>
                            <button id="item3_add">+</button>
                        </div>
                        <button id="item3_buy">加入購物車</button>
                        <p id="item3_stock">庫存:10</p>
                    </div>
                </div>
            </div>
            <div id="sports_car_groop" class="items_page">
                <div class="single_item">
                    <img src="./picture/布加迪.png" alt="pic">
                    <div class="single_item_detail">
                        <p>布加迪  $3500</p>
                        <div>
                            <button id="item4_minus">-</button>
                            <p id="item4_select_num">0</p>
                            <button id="item4_add">+</button>
                        </div>
                        <button id="item4_buy">加入購物車</button>
                        <p id="item4_stock">庫存:10</p>
                    </div>
                </div>
                <div class="single_item">
                    <img src="./picture/法拉利.png" alt="pic">
                    <div class="single_item_detail">
                        <p>法拉利  $4300</p>
                        <div>
                            <button id="item5_minus">-</button>
                            <p id="item5_select_num">0</p>
                            <button id="item5_add">+</button>
                        </div>
                        <button id="item5_buy">加入購物車</button>
                        <p id="item5_stock">庫存:10</p>
                    </div>
                </div>
            </div>
            <div id="airplain_groop" class="items_page">
                <div class="single_item">
                    <img src="./picture/p51d遙控飛機.png" alt="pic">
                    <div class="single_item_detail">
                        <p>p51d遙控飛機  $7400</p>
                        <div>
                            <button id="item6_minus">-</button>
                            <p id="item6_select_num">0</p>
                            <button id="item6_add">+</button>
                        </div>
                        <button id="item6_buy">加入購物車</button>
                        <p id="item6_stock">庫存:10</p>
                    </div>
                </div>
                <div class="single_item">
                    <img src="./picture/飛狼遙控直升機.png" alt="pic">
                    <div class="single_item_detail">
                        <p>飛狼遙控直升機  $8600</p>
                        <div>
                            <button id="item7_minus">-</button>
                            <p id="item7_select_num">0</p>
                            <button id="item7_add">+</button>
                        </div>
                        <button id="item7_buy">加入購物車</button>
                        <p id="item7_stock">庫存:10</p>
                    </div>
                </div>
            </div>
            <div id="drone_groop" class="items_page">
                <div class="single_item">
                    <img src="./picture/無人機.png" alt="pic">
                    <div class="single_item_detail">
                        <p>無人機  $23000</p>
                        <div>
                            <button id="item8_minus">-</button>
                            <p id="item8_select_num">0</p>
                            <button id="item8_add">+</button>
                        </div>
                        <button id="item8_buy">加入購物車</button>
                        <p id="item8_stock">庫存:10</p>
                    </div>
                </div>
                <div class="single_item">
                    <img src="./picture/迷你無人機.png" alt="pic">
                    <div class="single_item_detail">
                        <p>迷你無人機  $15600</p>
                        <div>
                            <button id="item9_minus">-</button>
                            <p id="item9_select_num">0</p>
                            <button id="item9_add">+</button>
                        </div>
                        <button id="item9_buy">加入購物車</button>
                        <p id="item9_stock">庫存:10</p>
                    </div>
                </div>
            </div>
        </div>
        <div id="user_cart_items_page" class="page">
            <h2 id="topic_shopping_car">目前沒有商品在購物車中</h2>
        </div>
        <div id="checkout_page" class="page"></div>
    </main>
    <div id="view_cart_items">
        <button id="refresh_btn">refresh</button>
        <button id="cart_items_btn">
            <span id="total_price_state">查看清單</span>
            <img src="./picture/shopping_car.png">
            <span id="total_price">$0</span>
        </button>
    </div>
    <script src="data_dealing.js"></script>
    <script src="functional.js"></script>
    <script src="interactive.js"></script>
</body>
</html>
